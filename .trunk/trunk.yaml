# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# Configuration reference: https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0

# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk-config

    - id: add-trailing-comma-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-add-trailing-comma

    - id: pyrefly-plugin
      ref: v0.2.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-pyrefly

    - id: tach-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-tach

# actionlint switched from upstream rhysd/actionlint to the actively maintained
# fork kjanat/actionlint (forked from upstream v1.7.12, independent releases from
# v1.8.0, CLI-compatible). Trunk's plugin catalog still pins the rhysd download
# URL, so override it here until the catalog carries the fork. Asset naming and
# the -format JSON output the plugin's `lint` command relies on are unchanged.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip

# Match the shared linter suite; use Python >=3.11 for this project and Node 22
# for the pinned Markdown tooling instead of the shared plugin's older defaults.
runtimes:
  enabled:
    - node@22.16.0
    - python@3.11.12

# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
        - name: lint
          enabled: true

    - name: pyrefly
      commands:
        - name: lint
          # Keep project discovery independent of Trunk's sandbox directory.
          run: pyrefly check --config ${workspace}/pyrefly.toml --python-interpreter-path ${workspace}/.venv/bin/python --search-path ${workspace} --output-format=min-text --summary=none ${target}
          # Installed project dependencies can change without source edits.
          cache_results: false
      affects_cache:
        - pyrefly.toml
        - pyproject.toml
        - uv.lock

    - name: tach
      files: [python, tach-config]
      commands:
        # The plugin's regex only captures located import errors. Configuration
        # and unused-dependency errors can have no file/line, so fail on every
        # nonzero exit instead of silently dropping those diagnostics.
        - name: lint
          success_codes: [0]
        - name: external
          run: tach check-external
          output: regex
          parse_regex: "\\[FAIL\\] (?P<path>[^:]+):(?P<line>\\d+): (?P<message>.*)"
          read_output_from: stderr
          success_codes: [0]
          batch: true
          cache_results: false

    # Keep Vale scoped to docs/**, matching the reference. There's no
    # first-class "restrict this linter to a directory" field on `enabled`
    # entries, so introduce a custom file type matched by full relative
    # path -- `regexes` match against the path from the repo root, unlike
    # `extensions`, which would also pick up markdown outside docs/ (e.g.
    # webhooks/README.md, CHANGELOG.md).
    - name: vale
      files: [docs-markdown]

  files:
    - name: tach-config
      filenames: [tach.toml, tach.domain.toml, pyproject.toml]

    - name: docs-markdown
      regexes:
        - ^docs/.+\.(md|mdx)$

  enabled:
    - actionlint@1.17.0
    - add-trailing-comma@4.0.0
    - bandit@1.9.4
    - buildifier@8.2.1
    - checkov@3.3.19
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.3
    - osv-scanner@2.6.0
    - oxipng@10.1.1
    - pinact@4.0.0
    - pyrefly@1.3.1
    - pyright@1.1.414
    - ruff@0.16.8
    - semgrep@1.177.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - squawk@2.65.0
    - svgo@4.1.0
    - tach@0.35.1
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.95.3
    - vale@3.14.1
    - yamlfmt@0.21.0
    - yamllint@1.38.0

  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - ty
    - txtpbfmt
    - yapf

  # Only scratch directories are excluded globally. Source, tests, prompts,
  # and findings remain covered by every applicable check.
  ignore:
    - linters: [ALL]
      paths:
        - tmp/**
        - worktrees/**

    - linters: [ruff]
      paths:
        - "*.ipynb"

    # Markdownlint does not parse MDX's JSX reliably.
    - linters: [markdownlint, markdownlint-cli2]
      paths:
        - docs/**/*.mdx

    - linters: [trivy]
      paths:
        - .trunk/**

  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js

actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available

  disabled:
    # Preserve this repo's existing hook policy; checks run on demand.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
