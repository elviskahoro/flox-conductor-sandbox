name: conductor-startup-script-cloud checks

# Automated validation for the workspace startup script (roborev review
# finding: pins were duplicated across files with only comments keeping them
# in sync, and the container verification existed only in a commit message).
# No secrets and no FloxHub auth here — public network only — so unlike
# floxhub-provision-check.yml this is safe to run on every push/PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin sync + paste-safety (roborev/trunk pins vs the Flox manifests and the trunk preflight)
        run: bash scripts/validate-pins.sh

      # Same drift class validate-pins.sh guards against, for prompts: the
      # canonical prompt text is prompts/conductor/*.md, the installed copy
      # lives in .conductor/settings.toml [prompts] — gtm-sdk hand-maintained
      # that copy and it drifted from its .md source (the TOML still said
      # `git roborev` after gtm-sdk#921 fixed the .md), so the mismatch is
      # checked mechanically here instead of trusted.
      # --no-project --with tomlkit: the installer's only third-party import
      # is tomlkit, so skip the full project sync (dagger-io et al.) that
      # plain `uv run` would pull in on every push/PR (roborev finding).
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Conductor prompts installer self-test (fresh install, idempotency, drift detection, error paths)
        run: uv run --no-project --with "tomlkit>=0.15.1" scripts/install-conductor-prompts.py --self-test

      - name: Conductor prompts drift check (prompts/conductor/*.md vs .conductor/settings.toml)
        run: uv run --no-project --with "tomlkit>=0.15.1" scripts/install-conductor-prompts.py --check

      - name: Shellcheck the provisioning scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck \
            scripts/conductor-startup-script-cloud.sh \
            scripts/conductor-trunk-preflight.sh \
            scripts/validate-pins.sh \
            scripts/conductor-startup-script-cloud-test.sh

      - name: Container test (amazonlinux:2023, non-root + passwordless sudo, x86_64)
        run: |
          docker run --platform linux/amd64 --rm \
            -v "$PWD":/src:ro -w /src \
            amazonlinux:2023 bash scripts/conductor-startup-script-cloud-test.sh
