# Migrated from .github/workflows/floxhub-provision-check.yml
# Manual-only (was workflow_dispatch): authenticates a throwaway container to
# FloxHub, so it must never run on push/PR. Only a cli trigger is defined.
# Secrets needed in the RWX vault: FLOXHUB_TOKEN, DOLTHUB_DOLT_CREDENTIAL_JWK.
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.0
    with:
      repository: https://github.com/elviskahoro/flox-conductor-sandbox.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: uv
    run: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  - key: dagger-cli
    run: |
      curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"
      "$HOME/.local/bin/dagger" version

  - key: dagger-provision-check
    use: [code, uv, dagger-cli]
    docker: true
    env:
      FLOXHUB_TOKEN: ${{ secrets.FLOXHUB_TOKEN }}
      DOLTHUB_DOLT_CREDENTIAL_JWK: ${{ secrets.DOLTHUB_DOLT_CREDENTIAL_JWK }}
      REQUIRE_BEADS_CHECK: "1"
    run: uv run dagger run python scripts/dagger_provision_test.py
