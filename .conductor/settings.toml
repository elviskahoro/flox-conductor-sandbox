"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
set -e

SETUP_LOG="$HOME/.conductor-setup.log"
: > "$SETUP_LOG"
# Plain append redirect, not `exec > >(tee ...)`: some Conductor sandboxes have
# no /dev/fd, which makes bash's process-substitution fd unopenable and (with
# `set -e`) silently kills the whole script on this very line before anything
# else runs (see gtm-sdk#279). The log file is the thing we audit.
exec >> "$SETUP_LOG" 2>&1
echo "=== setup started $(date -u +%FT%TZ) ==="

# Provision the Trunk Launcher before the long-running harness. Trunk checks
# are local and intentionally unauthenticated; no Trunk token or login is
# needed. The preflight exposes the launcher through /usr/local/bin so it is
# still available after this setup process exits.
bash scripts/conductor-trunk-preflight.sh
trunk --version
if ! trunk check --ci --no-fix --all; then
  echo "error: trunk check failed during workspace setup" >&2
  exit 1
fi

# Provision the pinned Beads CLI before the long-running harness. Conductor can
# start an agent command while setup is still running, so this must not be
# deferred until the harness's Stage 3b. The script records the exact binary
# path in the setup log and fails clearly if provisioning is impossible.
bash scripts/conductor-bd-preflight.sh

# Python 3.11 + the priority CLIs (roborev, trunk, rwx) for this workspace
# class: AL2023/Vercel sandboxes ship python3=3.9 while pyproject.toml
# requires >=3.11, and nothing here provisions rwx at all. Runs before
# sandbox-test.sh so the tools exist before the harness. CLI failures are
# non-fatal and summarized (the gtm-sdk#702 fallback-installer idiom).
# A Python 3.11 failure exits non-zero (the stated requirement), but the
# harness below still runs first — setup tolerates that exit here and
# fails at the very end instead (roborev review finding: a provisioning
# failure must not block the harness findings).
CLOUD_INSTALL_RC=0
bash scripts/conductor-cloud-install.sh || CLOUD_INSTALL_RC=$?
if [ "$CLOUD_INSTALL_RC" -ne 0 ]; then
  echo "error: conductor-cloud-install.sh failed (exit $CLOUD_INSTALL_RC); continuing setup so the harness still runs, but setup will fail at the end" >&2
fi
# The install script's no-sudo fallback can land tools in ~/.local/bin,
# which is NOT on later steps' default PATH — export it for the rest of
# setup (harmless when nothing landed there). The script's own PATH export
# is process-scoped and dies with it.
export PATH="${HOME}/.local/bin:${PATH}"

# The whole point of this repo: run the gtm-sdk#445 hypothesis harness on a
# fresh sandbox. It never hard-fails; findings land in findings/report-*.md.
bash scripts/sandbox-test.sh

# Make Infisical available to subsequent agent commands. Flox activation is
# process-scoped, so its run-bin directory disappears from PATH when setup
# exits. bd is provisioned by the preflight above so it is available before
# the harness starts.
INFISICAL_BIN="$(flox activate --dir "$PWD/envs/prebuilt" --mode run -- sh -c 'command -v infisical')"
if [ ! -x "$INFISICAL_BIN" ] || ! command -v bd >/dev/null 2>&1; then
  echo "error: setup did not produce a runnable infisical and bd command" >&2
  exit 1
fi
sudo install -d -m 755 /usr/local/bin
sudo ln -sfn "$INFISICAL_BIN" /usr/local/bin/infisical
infisical --version
bd version

# Provision the published roborev CLI when this workspace has an explicit
# FloxHub token — the production path (gtm-sdk#506). Like bd above, expose
# the immutable Flox/Nix binary through /usr/local/bin so subsequent
# non-interactive agent commands can find it after the process-scoped Flox
# activation exits. Keep this opt-in: a tokenless sandbox must remain
# usable without FloxHub authentication (conductor-cloud-install.sh above
# already installed the pinned release binary by then, so roborev is
# present either way).
#
# Non-fatal by design (roborev review finding): conductor-cloud-install.sh
# above installs the pinned 0.63.0 release binary as the guaranteed floor,
# and this block re-points /usr/local/bin/roborev at the published
# elvis/roborev package when it succeeds. A FloxHub failure (expired
# token, outage, platform gap) warns loudly and leaves the pinned binary
# in place instead of aborting setup — the failure stays visible in this
# log without costing the workspace its roborev.
if [ -n "${FLOXHUB_TOKEN:-}" ]; then
  echo "FLOXHUB_TOKEN set; provisioning roborev from FloxHub..."
  if bash "$PWD/scripts/floxhub-provision.sh" &&
    ROBOREV_BIN="$(readlink -f "$(flox activate --dir "$PWD/envs/floxhub-provision" --mode run -- sh -c 'command -v roborev')")" &&
    [ -x "$ROBOREV_BIN" ]; then
    sudo ln -sfn "$ROBOREV_BIN" /usr/local/bin/roborev
    sudo ln -sfn "$ROBOREV_BIN" /usr/local/bin/git-roborev
    roborev version
  else
    echo "error: FloxHub provisioning failed (see output above); keeping the pinned roborev binary installed by conductor-cloud-install.sh" >&2
  fi
else
  echo "FLOXHUB_TOKEN absent; roborev stays on the pinned binary installed by conductor-cloud-install.sh"
fi

# Validate workspace-provided Infisical machine credentials without exposing
# secret values. The export output is discarded; only the command status is
# used. Keep this optional so workspaces that only need the CLI still set up
# without Infisical credentials.
if [ -n "${INFISICAL_TOKEN:-}" ] && [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
  echo "INFISICAL_TOKEN and INFISICAL_PROJECT_ID set; validating Infisical read access..."
  if infisical export --env=dev --projectId "$INFISICAL_PROJECT_ID" --silent >/dev/null; then
    echo "Infisical authenticated read succeeded"
  else
    echo "error: Infisical authenticated read failed" >&2
    exit 1
  fi
else
  echo "INFISICAL_TOKEN or INFISICAL_PROJECT_ID absent; skipping Infisical auth validation"
fi

# Initialize or refresh the Beads database during workspace bootstrap when
# this workspace has the Infisical credentials required for DoltHub access.
# The pull script imports the Dolt JWK into a temporary credential root and
# never persists the secret. Run it inside the prebuilt environment so dolt is
# available even though Flox activation is process-scoped. Workspaces without
# Infisical credentials retain the sandbox's existing no-remote behavior.
if [ -n "${INFISICAL_TOKEN:-}" ] && [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
  echo "Infisical credentials present; initializing or pulling Beads from DoltHub..."
  flox activate --dir "$PWD/envs/prebuilt" --mode run -- \
    bash "$PWD/scripts/beads-dolthub-pull.sh"
else
  echo "Infisical credentials absent; skipping automatic Beads DoltHub pull"
fi

# Auto-authenticate flox — opt-in only, via FLOXHUB_AUTOLOGIN=1 — when
# FLOXHUB_TOKEN is present in the environment (set via this user's
# ~/.conductor/settings.toml [environment_variables.cloud]). Skipped by
# default even when FLOXHUB_TOKEN is present, so every fresh sandbox stays
# genuinely unauthenticated unless a task explicitly asks for auth (e.g. a
# publish task, or Phase D MVP's scripts/floxhub-provision.sh). This is what
# keeps a fresh sandbox usable for Stage 4 (H4, issue #16), which requires a
# never-authenticated sandbox to mean anything.
#
# Previously (2f731a5) this ran unconditionally whenever FLOXHUB_TOKEN was
# set, trading that away for provisioning convenience — but that silently
# disqualified every fresh sandbox from ever being usable for Stage 4,
# contradicting issue #16's own trap #5 ("never wire auth into the default
# provisioning path"). Reverted to opt-in: set FLOXHUB_AUTOLOGIN=1 (alongside
# FLOXHUB_TOKEN) for a workspace/task that specifically wants a
# pre-authenticated sandbox.
#
# --insecure-storage is required: cloud sandboxes have no dbus/keyring for
# flox's default token storage. Never hard-fails setup.
#
# Must run after `bash scripts/sandbox-test.sh` above: that script's Stage 1
# is what installs the `flox` binary, so attempting `flox auth login` any
# earlier in this setup script always fails with "flox: command not found"
# and is never retried (see ~/.conductor-setup.log from any sandbox
# provisioned before this fix).
if [ -n "${FLOXHUB_AUTOLOGIN:-}" ] && [ -n "${FLOXHUB_TOKEN:-}" ]; then
  echo "FLOXHUB_AUTOLOGIN=1 and FLOXHUB_TOKEN set; attempting flox auth login..."
  if echo "$FLOXHUB_TOKEN" | flox auth login --token-file=- --insecure-storage; then
    echo "flox auth login succeeded"
  else
    echo "flox auth login failed (see output above); continuing unauthenticated"
  fi
else
  echo "FLOXHUB_AUTOLOGIN not set (or FLOXHUB_TOKEN absent); skipping flox auth login — sandbox stays unauthenticated by default"
fi

echo "=== setup finished $(date -u +%FT%TZ) ==="

# Deferred provisioning failure (roborev review finding): a
# conductor-cloud-install.sh failure earlier in setup must not block the
# harness above, but it must still fail setup — Python 3.11 is a hard
# requirement of this workspace (pyproject.toml requires >=3.11). Fail
# here, after every step has had its chance to run and report.
if [ "$CLOUD_INSTALL_RC" -ne 0 ]; then
  echo "error: setup finished with provisioning failures (conductor-cloud-install.sh exit $CLOUD_INSTALL_RC); see $HOME/.conductor-setup.log" >&2
  exit 1
fi
"""
