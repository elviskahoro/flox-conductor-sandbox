"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
set -e

SETUP_LOG="$HOME/.conductor-setup.log"
: > "$SETUP_LOG"
# Plain append redirect, not `exec > >(tee ...)`: some Conductor sandboxes have
# no /dev/fd, which makes bash's process-substitution fd unopenable and (with
# `set -e`) silently kills the whole script on this very line before anything
# else runs (see gtm-sdk#279). The log file is the thing we audit.
exec >> "$SETUP_LOG" 2>&1
echo "=== setup started $(date -u +%FT%TZ) ==="

# The whole point of this repo: run the gtm-sdk#445 hypothesis harness on a
# fresh sandbox. It never hard-fails; findings land in findings/report-*.md.
# This is also what installs the `flox` binary (its Stage 1), which is why
# the FLOXHUB_TOKEN auth-login block below runs after it, not before.
bash scripts/sandbox-test.sh

# Make the tools that the harness just validated available to every subsequent
# agent command. Flox activation is process-scoped, so its run-bin directory
# disappears from PATH when setup exits. Pointing /usr/local/bin at the
# immutable Nix-store binaries keeps both CLIs usable without an activation
# shell and does not require FloxHub authentication: Infisical comes from the
# public catalog and bd is built locally by Stage 3b above.
INFISICAL_BIN="$(readlink -f "$(flox activate --dir "$PWD/envs/prebuilt" --mode run -- sh -c 'command -v infisical')")"
BD_BIN="$(readlink -f "$PWD/envs/repackage/result-bd/bin/bd")"
if [ ! -x "$INFISICAL_BIN" ] || [ ! -x "$BD_BIN" ]; then
  echo "error: setup did not produce a runnable infisical and bd binary" >&2
  exit 1
fi
sudo install -d -m 755 /usr/local/bin
sudo ln -sfn "$INFISICAL_BIN" /usr/local/bin/infisical
sudo ln -sfn "$BD_BIN" /usr/local/bin/bd
infisical --version
bd version

# Provision the published roborev CLI when this workspace has an explicit
# FloxHub token. Like bd above, expose the immutable Flox/Nix binary through
# /usr/local/bin so subsequent non-interactive agent commands can find it
# after the process-scoped Flox activation exits. Keep this opt-in: a
# tokenless sandbox must remain usable without FloxHub authentication.
if [ -n "${FLOXHUB_TOKEN:-}" ]; then
  echo "FLOXHUB_TOKEN set; provisioning roborev from FloxHub..."
  if ! bash "$PWD/scripts/floxhub-provision.sh"; then
    echo "error: FloxHub provisioning failed; roborev was not installed" >&2
    exit 1
  fi
  ROBOREV_BIN="$(readlink -f "$(flox activate --dir "$PWD/envs/floxhub-provision" --mode run -- sh -c 'command -v roborev')")"
  if [ ! -x "$ROBOREV_BIN" ]; then
    echo "error: setup did not produce a runnable roborev binary" >&2
    exit 1
  fi
  sudo ln -sfn "$ROBOREV_BIN" /usr/local/bin/roborev
  sudo ln -sfn "$ROBOREV_BIN" /usr/local/bin/git-roborev
  roborev version
else
  echo "FLOXHUB_TOKEN absent; skipping roborev FloxHub provisioning"
fi

# Validate workspace-provided Infisical machine credentials without exposing
# secret values. The export output is discarded; only the command status is
# used. Keep this optional so workspaces that only need the CLI still set up
# without Infisical credentials.
if [ -n "${INFISICAL_TOKEN:-}" ] && [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
  echo "INFISICAL_TOKEN and INFISICAL_PROJECT_ID set; validating Infisical read access..."
  if infisical export --env=dev --projectId "$INFISICAL_PROJECT_ID" --silent >/dev/null; then
    echo "Infisical authenticated read succeeded"
  else
    echo "error: Infisical authenticated read failed" >&2
    exit 1
  fi
else
  echo "INFISICAL_TOKEN or INFISICAL_PROJECT_ID absent; skipping Infisical auth validation"
fi

# Initialize or refresh the Beads database during workspace bootstrap when
# this workspace has the Infisical credentials required for DoltHub access.
# The pull script imports the Dolt JWK into a temporary credential root and
# never persists the secret. Run it inside the prebuilt environment so dolt is
# available even though Flox activation is process-scoped. Workspaces without
# Infisical credentials retain the sandbox's existing no-remote behavior.
if [ -n "${INFISICAL_TOKEN:-}" ] && [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
  echo "Infisical credentials present; initializing or pulling Beads from DoltHub..."
  flox activate --dir "$PWD/envs/prebuilt" --mode run -- \
    bash "$PWD/scripts/beads-dolthub-pull.sh"
else
  echo "Infisical credentials absent; skipping automatic Beads DoltHub pull"
fi

# Auto-authenticate flox — opt-in only, via FLOXHUB_AUTOLOGIN=1 — when
# FLOXHUB_TOKEN is present in the environment (set via this user's
# ~/.conductor/settings.toml [environment_variables.cloud]). Skipped by
# default even when FLOXHUB_TOKEN is present, so every fresh sandbox stays
# genuinely unauthenticated unless a task explicitly asks for auth (e.g. a
# publish task, or Phase D MVP's scripts/floxhub-provision.sh). This is what
# keeps a fresh sandbox usable for Stage 4 (H4, issue #16), which requires a
# never-authenticated sandbox to mean anything.
#
# Previously (2f731a5) this ran unconditionally whenever FLOXHUB_TOKEN was
# set, trading that away for provisioning convenience — but that silently
# disqualified every fresh sandbox from ever being usable for Stage 4,
# contradicting issue #16's own trap #5 ("never wire auth into the default
# provisioning path"). Reverted to opt-in: set FLOXHUB_AUTOLOGIN=1 (alongside
# FLOXHUB_TOKEN) for a workspace/task that specifically wants a
# pre-authenticated sandbox.
#
# --insecure-storage is required: cloud sandboxes have no dbus/keyring for
# flox's default token storage. Never hard-fails setup.
#
# Must run after `bash scripts/sandbox-test.sh` above: that script's Stage 1
# is what installs the `flox` binary, so attempting `flox auth login` any
# earlier in this setup script always fails with "flox: command not found"
# and is never retried (see ~/.conductor-setup.log from any sandbox
# provisioned before this fix).
if [ -n "${FLOXHUB_AUTOLOGIN:-}" ] && [ -n "${FLOXHUB_TOKEN:-}" ]; then
  echo "FLOXHUB_AUTOLOGIN=1 and FLOXHUB_TOKEN set; attempting flox auth login..."
  if echo "$FLOXHUB_TOKEN" | flox auth login --token-file=- --insecure-storage; then
    echo "flox auth login succeeded"
  else
    echo "flox auth login failed (see output above); continuing unauthenticated"
  fi
else
  echo "FLOXHUB_AUTOLOGIN not set (or FLOXHUB_TOKEN absent); skipping flox auth login — sandbox stays unauthenticated by default"
fi

echo "=== setup finished $(date -u +%FT%TZ) ==="
"""
