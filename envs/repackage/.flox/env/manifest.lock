    "build": {
      "bd": {
        "command": "  set -euo pipefail\n  version=\"1.1.2\"\n  case \"$(uname -s)-$(uname -m)\" in\n    Linux-x86_64)\n      asset=\"beads_${version}_linux_amd64.tar.gz\"\n      sha256=\"a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2\"\n      ;;\n    Linux-aarch64)\n      asset=\"beads_${version}_linux_arm64.tar.gz\"\n      sha256=\"a134015faf4be0a43f8681a8d602eaf0b7c255c957f09d3c933257c8c92fdd10\"\n      ;;\n    Darwin-arm64)\n      asset=\"beads_${version}_darwin_arm64.tar.gz\"\n      sha256=\"9b0137a83a2afd343e2abd2a506be72ea032721000f76669c2cf81729e78501d\"\n      ;;\n    *)\n      echo \"error: no pinned beads asset for $(uname -s)-$(uname -m)\" >&2\n      exit 1\n      ;;\n  esac\n  # nixpkgs curl does not fall back to distro CA paths; point it at the\n  # cacert package installed in this env unless the caller already set one.\n  if [ -z \"${SSL_CERT_FILE:-}\" ] && [ -f \"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\" ]; then\n    export SSL_CERT_FILE=\"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\"\n  fi\n  tmp=\"$(mktemp -d)\"\n  trap 'rm -rf \"${tmp}\"' EXIT\n  curl -fsSL -o \"${tmp}/${asset}\" \\\n    \"https://github.com/gastownhall/beads/releases/download/v${version}/${asset}\"\n  echo \"${sha256}  ${tmp}/${asset}\" | sha256sum --check -\n  tar -xzf \"${tmp}/${asset}\" -C \"${tmp}\"\n  mkdir -p \"$out/bin\"\n  install -m755 \"${tmp}/bd\" \"$out/bin/bd\"\n",
        "sandbox": "off",
        "version": "1.1.2",
        "description": "beads (bd) CLI repackaged from official upstream release binaries"
      },
      "conductor-workspace-floxhub-01": {
        "command": "  mkdir -p \"$out/bin\"\n  {\n    echo '#!/usr/bin/env bash'\n    echo 'echo \"hello from a flox-built package (gtm-sdk#445 preflight)\"'\n  } > \"$out/bin/conductor-workspace-floxhub-01\"\n  chmod +x \"$out/bin/conductor-workspace-floxhub-01\"\n",
        "version": "0.0.1",
        "description": "Trivial flox build smoke test (gtm-sdk#445 preflight)"
      },
      "hookdeck": {
        "command": "  set -euo pipefail\n  version=\"2.3.1\"\n  case \"$(uname -s)-$(uname -m)\" in\n    Linux-x86_64)\n      asset=\"hookdeck_${version}_linux_amd64.tar.gz\"\n      sha256=\"0a1c149f960393aaacc3630d1c09af3950004658fdf2dc21f1edce9a4ae0b732\"\n      ;;\n    Linux-aarch64)\n      asset=\"hookdeck_${version}_linux_arm64.tar.gz\"\n      sha256=\"737c3243e4ba5b679d89d3f7b698162b6aec7761319142cf3813dd856a55eab7\"\n      ;;\n    Darwin-arm64)\n      asset=\"hookdeck_${version}_darwin_arm64.tar.gz\"\n      sha256=\"fe11673ad1379f75947f5e095f429ecee570ecf8c03c5d58c3d0e6e3396e981a\"\n      ;;\n    *)\n      echo \"error: no pinned Hookdeck asset for $(uname -s)-$(uname -m)\" >&2\n      exit 1\n      ;;\n  esac\n  if [ -z \"${SSL_CERT_FILE:-}\" ] && [ -f \"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\" ]; then\n    export SSL_CERT_FILE=\"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\"\n  fi\n  tmp=\"$(mktemp -d)\"\n  trap 'rm -rf \"${tmp}\"' EXIT\n  curl -fsSL -o \"${tmp}/${asset}\" \\\n    \"https://github.com/hookdeck/hookdeck-cli/releases/download/v${version}/${asset}\"\n  echo \"${sha256}  ${tmp}/${asset}\" | sha256sum --check -\n  tar -xzf \"${tmp}/${asset}\" -C \"${tmp}\"\n  mkdir -p \"$out/bin\"\n  install -m755 \"${tmp}/hookdeck\" \"$out/bin/hookdeck\"\n",
        "sandbox": "off",
        "version": "2.3.1",
        "description": "Hookdeck CLI repackaged from official upstream release binaries"
      },
      "roborev": {
        "command": "  set -euo pipefail\n  version=\"0.63.0\"\n  case \"$(uname -s)-$(uname -m)\" in\n    Linux-x86_64)\n      asset=\"roborev_${version}_linux_amd64.tar.gz\"\n      sha256=\"c7dbbefed91747b80d04498358fa0207880adb7e2b57c95677214195a3ece887\"\n      ;;\n    Linux-aarch64)\n      asset=\"roborev_${version}_linux_arm64.tar.gz\"\n      sha256=\"bcb1e96d13efb903a80f965581c23bcf8e6d39a92ded01bf8ee61a2e9e18fe71\"\n      ;;\n    Darwin-arm64)\n      asset=\"roborev_${version}_darwin_arm64.tar.gz\"\n      sha256=\"696161b785d5bf45f635af993c4a32334c545a5d8747e41213356d33fe2fd5e1\"\n      ;;\n    *)\n      echo \"error: no pinned roborev asset for $(uname -s)-$(uname -m)\" >&2\n      exit 1\n      ;;\n  esac\n  # nixpkgs curl does not fall back to distro CA paths; point it at the\n  # cacert package installed in this env unless the caller already set one.\n  if [ -z \"${SSL_CERT_FILE:-}\" ] && [ -f \"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\" ]; then\n    export SSL_CERT_FILE=\"${FLOX_ENV}/etc/ssl/certs/ca-bundle.crt\"\n  fi\n  tmp=\"$(mktemp -d)\"\n  trap 'rm -rf \"${tmp}\"' EXIT\n  curl -fsSL -o \"${tmp}/${asset}\" \\\n    \"https://github.com/kenn-io/roborev/releases/download/v${version}/${asset}\"\n  echo \"${sha256}  ${tmp}/${asset}\" | sha256sum --check -\n  tar -xzf \"${tmp}/${asset}\" -C \"${tmp}\"\n  mkdir -p \"$out/bin\"\n  install -m755 \"${tmp}/roborev\" \"$out/bin/roborev\"\n",
        "sandbox": "off",
        "version": "0.63.0",
        "description": "roborev CLI repackaged from official upstream release binaries"
